[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "curl-sms"
dynamic = ["version"]
description = "Official Python client for the curl-sms SMS API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "curl-sms", email = "help@curl-sms.com" }]
maintainers = [{ name = "curl-sms", email = "help@curl-sms.com" }]
keywords = ["sms", "sms-api", "sms-gateway", "curl-sms", "text-message", "rest-api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://curl-sms.com"
Documentation = "https://curl-sms.com/docs"
Source = "https://github.com/curl-sms/curl-sms-python"
Changelog = "https://github.com/curl-sms/curl-sms-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/curl-sms/curl-sms-python/issues"

[tool.hatch.version]
path = "src/curl_sms/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/curl_sms"]

[tool.hatch.build.targets.sdist]
include = [
    "src/curl_sms",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "A", "C4", "PT"]
ignore = [
    "A002",   # `id` parameters mirror the API
    "A003",   # `list` method mirrors the API
    "UP006",  # typing.List in TypedDicts evaluated on Python 3.9
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
# Keep Optional[...] so typing.get_type_hints() works on Python 3.9.
"src/curl_sms/types.py" = ["UP007", "UP045"]
